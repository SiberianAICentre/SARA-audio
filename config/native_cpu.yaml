audio:
  target_sample_rate_hz: 16000
  mono: true
  operator_channel_index: 1
  allow_mono_operator_fallback: true
vad:
  frame_duration_ms: 30
  pause_threshold_ms: 300
  min_speech_duration_ms: 90
  absolute_energy_floor_dbfs: -45.0
  activation_margin_db: 10.0
opensmile:
  enabled: true
  feature_set: ComParE_2016
  frame_step_seconds: 0.01
  aggregate_statistics: [mean, std, min, max]
mic:
  enabled: true
  utterance_merge_gap_s: 1.2
text_embeddings:
  enabled: false
  model_name: ai-forever/ru-en-RoSBERTa
  device: cpu
  max_length: 512
  feature_prefix: bert_
prediction:
  enabled: true
  filter_model_path: models/methodology/filter.json
  methodology_model_directory: models/methodology
  filter_threshold: 0.5
  formats: [csv, json]
execution:
  output_root: artifacts
  feature_formats: [csv]
  frame_formats: [csv]
  write_frames: false
  write_segments: true
  transcript_mode: asr
  transcript_directory: null
  transcript_suffix: .txt
  batch_size: 4
asr:
  model: small
  language: ru
  device: cpu
  compute_type: int8
  initial_prompt: >
    Разговор клиента с оператором техподдержки (IP-адрес, роутер, интернет,
    сеть, логин, компьютер, пароли).
  vad_filter: true
  vad_min_speech_duration_ms: 250
  vad_max_speech_duration_s: 15.0
  vad_speech_pad_ms: 600
  no_speech_threshold: 0.8
  compression_ratio_threshold: 2.4
  temperature: [0.0, 0.2, 0.4, 0.6]
  suppress_common_hallucinations: true
